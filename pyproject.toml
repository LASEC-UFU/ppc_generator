[project]
name = "ppcgen"
version = "0.3.0"
description = "Gerador configurável de Projetos Pedagógicos de Curso (PPC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ppcgen = "ppcgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ppcgen",
    "ppcgen.leitores",
    "ppcgen.validadores",
    "ppcgen.geradores",
    "ppcgen.compiladores",
    "ppcgen.utilitarios",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Modelos de tabela LaTeX (colspecs/cabeçalhos) e o script de bootstrap de
# dados de exemplo são mais legíveis como linhas longas do que quebrados.
"ppcgen/geradores/fluxo.py" = ["E501"]
"ppcgen/geradores/tabelas.py" = ["E501"]
"ppcgen/geradores/latex.py" = ["E501"]
"ppcgen/geradores/relatorios.py" = ["E501"]
"scripts/criar_matriz_exemplo_cst.py" = ["E501"]
"testes/unitarios/test_leitores_excel.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
