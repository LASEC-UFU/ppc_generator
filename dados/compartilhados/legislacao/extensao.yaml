# Referencial legal compartilhado entre perfis (Seção 8/8-compartilhados).
# Aplica-se a qualquer curso de graduação, não apenas a um perfil específico.
referenciais:
  - id: MEC_CNE_CES_7_2018
    nome: Diretrizes para a extensão na Educação Superior
    tipo: resolucao
    documento: Resolução CNE/CES nº 7, de 18 de dezembro de 2018
    ano: 2018
    observacoes: >
      Base para o percentual mínimo de carga horária de extensão
      (curriculo.percentual_minimo_extensao em perfil.yaml). Aplicável a
      todos os cursos de graduação.

  - id: UFU_CONGRAD_177_2026
    nome: Regulamenta a inserção e operacionalização das ACEs nos currículos de graduação da UFU
    tipo: resolucao
    documento: Resolução CONGRAD nº 177, de 20 de fevereiro de 2026
    ano: 2026
    observacoes: >
      Norma institucional da UFU, atualmente vigente, para toda a carga
      horária de extensão de qualquer perfil que herde este arquivo:
      mínimo de 10% da carga horária total do curso (art. 4º §1º), com
      piso absoluto por grau quando não fixado em legislação superior —
      Bacharelado 240h, Licenciatura 320h, Tecnologia 160h (art. 4º §3º);
      ACEs distribuídas em no mínimo 3 componentes curriculares, em
      períodos distintos (art. 6º §4º); realização obrigatoriamente
      presencial, sem exceção de mediação digital para cursos
      tecnológicos — a exceção do art. 5º §7º II vale só para
      bacharelados; estágio obrigatório, monitoria e tutoria NÃO contam
      como ACE (art. 5º §4º). Revoga os arts. 1º a 11 da Resolução
      CONGRAD nº 13/2019 (não citar mais como vigente) e altera a
      Resolução CONGRAD nº 15/2016.

  - id: MEC_LEI_15388_2026
    nome: Plano Nacional de Educação 2026-2036 (PNE vigente)
    tipo: lei
    documento: Lei nº 15.388, de 14 de abril de 2026
    ano: 2026
    observacoes: >
      Substitui a Lei nº 13.005/2014 (PNE 2014-2024) como plano nacional
      de educação vigente. A meta de 10% de créditos curriculares em
      extensão, antes associada à Meta 12.7 da Lei nº 13.005/2014,
      passou a ser operacionalizada diretamente pela Resolução CONGRAD
      nº 177/2026 (UFU_CONGRAD_177_2026, acima) — o texto do novo PNE
      quanto à manutenção literal dessa meta ainda não foi verificado
      neste projeto (pendência).
