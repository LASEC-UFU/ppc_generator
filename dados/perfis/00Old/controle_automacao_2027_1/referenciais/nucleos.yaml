# Núcleos curriculares do curso ativo. Um componente ativo deve ter
# exatamente um destes ids em `nucleo_id` (aba "Componentes" da matriz).
nucleos:
  - id: BASICO
    nome: Formação Básica
    descricao: >
      Fundamentos de matemática, física e computação que sustentam a
      formação tecnológica.

  - id: HUMANISTICO
    nome: Formação Humanística e de Extensão
    descricao: >
      Componentes de formação cidadã, comunicação, gestão e atividades de
      extensão universitária.

  - id: TECNOLOGICO
    nome: Formação Tecnológica e Profissional
    descricao: >
      Núcleo específico do eixo tecnológico Controle e Processos
      Industriais: eletrônica, instrumentação, controle, automação
      industrial e áreas correlatas.

  - id: COMPLEMENTAR
    nome: Formação Complementar
    descricao: >
      Atividades acadêmicas complementares e demais componentes que
      enriquecem a formação sem pertencer ao núcleo tecnológico específico.

  - id: OPTATIVO
    nome: Formação Optativa
    descricao: Componentes optativos pré-aprovados, à escolha do estudante.
