# Registro de referência da ficha catalográfica do Catálogo Nacional de
# Cursos Superiores de Tecnologia (CNCST, 4ª edição, MEC/SETEC, 2024) para
# este curso — dados oficiais do CST em Automação Industrial, eixo
# tecnológico Controle e Processos Industriais.
#
# Este arquivo NÃO é lido pelo gerador: ppcgen/leitores/yaml.py só carrega
# nucleos.yaml, areas_formacao.yaml, competencias.yaml, conteudos.yaml,
# legislacao.yaml e temas_transversais.yaml de referenciais/ (ver
# docs/DICIONARIO_DADOS.md). Existe como registro de apoio/auditoria da
# base regulatória do curso. Os fatos relevantes já estão refletidos em:
# - perfil.yaml (curso.grau, curriculo.carga_horaria_total etc.)
# - referenciais/legislacao.yaml (entrada CNCST_2024_AUTOMACAO_INDUSTRIAL)
# - textos/identificacao.tex (denominação, titulação, portaria)

referencial:
  id: CNCST_2024_AUTOMACAO_INDUSTRIAL
  tipo: catalogo_nacional
  nome: >
    Catálogo Nacional de Cursos Superiores de Tecnologia —
    Curso Superior de Tecnologia em Automação Industrial
  edicao: 4
  ano: 2024
  ato_aprovacao:
    tipo: Portaria MEC
    numero: 514
    data: "2024-06-04"
  vigente: true

curso:
  denominacao_oficial: >
    Curso Superior de Tecnologia em Automação Industrial
  titulacao: Tecnólogo em Automação Industrial
  grau: Tecnológico
  eixo_tecnologico: Controle e Processos Industriais
  area_tecnologica: Eletrônica e Automação
  cine_brasil:
    codigo: 0714A01
    rotulo: Automação Industrial
  carga_horaria_minima: 2400
  duracao_estimada_anos: 3

ingresso:
  requisitos:
    - Ensino Médio concluído ou equivalente
    - Aprovação em processo seletivo

legislacao_profissional:
  - id: CONFEA_1073_2016
    tipo: Resolução
    orgao: CONFEA
    numero: 1073
    data: "2016-04-19"

ocupacoes_cbo:
  - codigo: "2021-15"
    nome: Tecnólogo em Mecatrônica
  - codigo: "2021-20"
    nome: Tecnólogo em Automação

infraestrutura_minima:
  - Biblioteca com acervo físico ou virtual específico e atualizado
  - Laboratório de informática
  - Laboratório de automação industrial
  - Laboratório de eletrônica
  - Laboratório de hidráulica e pneumática
  - Laboratório de instalações elétricas
  - Laboratório de redes industriais

estagio:
  pode_ser_obrigatorio: true
  decisao_da_instituicao: true
  integra_carga_minima_cncst: false
