perfil:
  id: tecnologo_automacao_2027_1
  nome: "Curso Superior de Tecnologia em Automação Industrial — Currículo 2027-1"
  status: proposta
  versao: "2027-1"
  descricao: >
    Curso Superior de Tecnologia em Automação Industrial (denominação
    regulatória conforme CNCST/MEC), com ênfase curricular em Robótica,
    Sistemas Inteligentes e Inteligência Artificial Aplicada à Automação.
    Divulgado institucionalmente como "Automação, Robótica e Inteligência
    Artificial", forma tecnólogos aptos a projetar, implementar e gerenciar
    sistemas automatizados industriais frente aos desafios da Indústria 4.0.

