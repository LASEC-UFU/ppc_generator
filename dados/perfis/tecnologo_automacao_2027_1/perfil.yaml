  # ppcgen.validadores.ead.TETO_EAD_POR_FORMATO).
  norma_federal: "Decreto nº 12.456/2025; Portaria MEC nº 378/2025"
  norma_institucional: null
  # PENDENTE: a UFU ainda não publicou a resolução do CONGRAD sobre oferta
  # de componentes EaD em cursos presenciais (processo SEI
  # 23117.070903/2023-41, altera a Resolução CONGRAD nº 35/2011) — estava
  # pautada para a 7ª reunião/2026 do CONGRAD (24/07/2026) sem publicação
  # localizada até a data desta auditoria (2026-07-30). Ver
  # docs/RELATORIO_AUDITORIA_NORMATIVA.md, Seção 2.
  status_validacao_institucional: pendente

