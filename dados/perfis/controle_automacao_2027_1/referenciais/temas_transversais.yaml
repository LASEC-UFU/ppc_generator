# Temas transversais (Seção 7): identificadores estáveis em vez de números
# mágicos. `status: obrigatorio` faz o validador alertar quando nenhum
# componente ativo cobre o tema; `status: sugerido` não gera alerta de
# ausência de cobertura (uso enquanto a aplicabilidade não é confirmada).
temas:
  - id: RELACOES_ETNICO_RACIAIS
    nome: Educação das Relações Étnico-Raciais
    descricao: >
      História e cultura afro-brasileira, africana e indígena.
    fonte_normativa: Resolução CNE/CP nº 1/2004
    status: obrigatorio

  - id: LIBRAS
    nome: Ensino de Libras
    descricao: Língua Brasileira de Sinais.
    fonte_normativa: Decreto nº 5.626/2005
    status: obrigatorio

  - id: DIREITOS_HUMANOS
    nome: Educação em Direitos Humanos
    descricao: ""
    fonte_normativa: Resolução CNE nº 1/2012
    status: obrigatorio

  - id: EDUCACAO_AMBIENTAL
    nome: Educação Ambiental
    descricao: ""
    fonte_normativa: Resolução CNE nº 2/2012
    status: obrigatorio

  - id: PREVENCAO_DESASTRES
    nome: Educação para Prevenção e Redução de Desastres
    descricao: >
      A lei referencia explicitamente cursos de Engenharia; aplicabilidade a
      um CST deve ser confirmada pelo NDE antes de tratar como obrigatório.
    fonte_normativa: Lei nº 13.425/2017
    status: sugerido
