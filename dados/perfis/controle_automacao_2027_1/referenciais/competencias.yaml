# Competências do Curso Superior de Tecnologia em Controle e Automação.
#
# Lista inicial elaborada como ponto de partida para este perfil — não é
# uma tradução do Computing Curricula 2020 nem de referenciais de
# Engenharia de Computação (Seção 24). Deve ser revisada e formalmente
# aprovada pelo Núcleo Docente Estruturante (NDE) do curso antes da
# submissão do PPC; `obrigatoria: true` faz o validador alertar se nenhum
# componente ativo cobrir a competência.
competencias:
  - id: PROJETAR_SISTEMAS_CONTROLE
    descricao: >
      Projetar, especificar e sintonizar sistemas de controle analógico e
      digital para processos industriais.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: PROGRAMAR_CLP_SUPERVISORIO
    descricao: >
      Programar controladores lógicos programáveis (CLPs) e sistemas
      supervisórios (SCADA/IHM) para automação de processos.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: ESPECIFICAR_INSTRUMENTACAO
    descricao: >
      Especificar, instalar e calibrar sensores, transdutores e atuadores
      utilizados em instrumentação industrial.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: PROJETAR_ACIONAMENTOS
    descricao: >
      Projetar e dimensionar sistemas de acionamento elétrico de máquinas e
      processos industriais.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: INTEGRAR_REDES_INDUSTRIAIS
    descricao: >
      Integrar dispositivos e sistemas por meio de redes de comunicação
      industrial e protocolos de automação.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: DESENVOLVER_SISTEMAS_EMBARCADOS
    descricao: >
      Desenvolver soluções com sistemas embarcados aplicados ao controle e
      à automação de processos.
    obrigatoria: false
    fonte: MEC_CATALOGO_CST

  - id: APLICAR_SEGURANCA_INDUSTRIAL
    descricao: >
      Aplicar normas de segurança do trabalho e de sistemas
      instrumentados de segurança em ambientes industriais automatizados.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST

  - id: GERIR_PROJETOS_AUTOMACAO
    descricao: >
      Planejar e gerir projetos de automação industrial, incluindo aspectos
      de custo, prazo e qualidade.
    obrigatoria: false
    fonte: MEC_CATALOGO_CST

  - id: ATUAR_ETICA_SUSTENTABILIDADE
    descricao: >
      Atuar profissionalmente com responsabilidade ética, social e
      ambiental.
    obrigatoria: true
    fonte: MEC_CATALOGO_CST
